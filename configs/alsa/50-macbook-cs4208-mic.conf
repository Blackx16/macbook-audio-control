# MacBook Audio Control Center - CS4208 3.5mm TRRS Headset Microphone Fix
# Overrides kernel snd_hda_codec_cs420x mba6_pincfgs where Node 0x18 is marked
# disconnected (0x43ab9030), restoring Node 0x18 as an active External Mic (0x00ab9150).
options snd-hda-intel patch=macbook-cs4208-mic.fw,macbook-cs4208-mic.fw
