# WirePlumber Pro-Audio ALSA Buffer & Headroom Fix
# Eliminates dropouts, crackling, and buffer underruns on MacBook Cirrus Logic CS4208
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.pci.*pro.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size   = 1024
        api.alsa.headroom      = 1024
        priority.driver        = 3000
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_input.pci.*pro.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size   = 1024
        api.alsa.headroom      = 1024
        priority.driver        = 2000
      }
    }
  }
]
